worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;

        set $frontend_host "http://stockroom_frontend";


        location / {
            proxy_pass http://stockroom_frontend:4200;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            proxy_pass http://stockroom_app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Configuração de segurança para esconder o backend
            proxy_hide_header X-Powered-By;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            # Restrição de acesso à API

      #   set $block_access 1;

      #   if ($http_referer = "") {
      #       set $block_access 0;
      #   }
      #   if ($block_access = 1) {
      #       return 403;
      #   }
            # CORS - Permitir requisições do Angular
      #        add_header Access-Control-Allow-Origin "http://stockroom_frontend:4200" always;
      #        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
      #        add_header Access-Control-Allow-Headers "Authorization, Content-Type";
      #        add_header Access-Control-Allow-Credentials "true";

            # Responder requisições OPTIONS diretamente
       #       if ($request_method = OPTIONS) {
      #            return 204;
      #        }
        }
    }
}
